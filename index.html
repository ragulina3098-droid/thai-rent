async function request(query='',options={}){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
 try{
  const response=await fetch(API+query,{...options,signal:controller.signal,headers:{apikey:API_KEY,'Content-Type':'application/json',...options.headers}});
  if(!response.ok)throw new Error('Request failed: '+response.status);
  return response.status===204?null:await response.json();
 }finally{clearTimeout(timer)}
}
let loadVersion=0;
async function loadAds(){
 const version=++loadVersion;loading=true;loadFailed=false;render();
 try{
  let result=[];
  for(let offset=0;;offset+=500){
   const page=await request('?select=id,name,city,type,price,contact&order=created_at.desc,id.desc&limit=500&offset='+offset);
   if(!Array.isArray(page))throw new Error('Invalid response');
   result.push(...page);if(page.length<500)break;
  }
  if(version===loadVersion)ads=result;
 }catch(e){if(version===loadVersion)loadFailed=true}
 finally{if(version===loadVersion){loading=false;render()}}
}
